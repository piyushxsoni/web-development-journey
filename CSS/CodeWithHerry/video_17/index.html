<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Element Selector */
        /* div{
            background-colour: red;
        } */

        /* Class Selector */
        .red{
            background-color: red;
        }
        /* ID Selector */
        #green{
            background-color: green;
        }
        /* Chlid Selectors */
        div > p{
            background-color: brown;
            color: rgb(9, 9, 70)
        }
        /* Descendant selector */
        div  p{
            background-color: brown;
            color: rgb(9, 9, 70)
        }
        /* Universal selector */
        *{
            margin: 0;
            padding: 0;
        }
        /* pseudo Selector */
        a:visited{
            color: rgb(199, 199, 25)
        }  
        a:link{
            color: green
        }
        a:active{
            background-color: red
        }
        a:hover{
            background-color: rgb(170, 242, 26)
        }
        p:first-child{
            background-color: rgb(144, 67, 67)
            
        }

    </style> 
</head>
<body>
    <main class="one">
        <p>i am fist one</p>
        <p>i am second one</p>
    </main>
    <div class="red">
        This  is a div section
    </div>
    <div id="green">
        This is 2nd section of div
        <article>

            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Minus voluptatem corrupti commodi officia perspiciatis accusamus.</p>
        </article>
    </div>
    <a href="https://www.google.com"> Go to Google</a>
    <a href="http://www.facebook.com">Go to Facebook</a>
</body>
</html>
